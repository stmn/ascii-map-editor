<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- pusta ikona: bez tego przegladarka strzela po /favicon.ico i loguje 404 -->
    <link rel="icon" href="data:," />
    <title>ASCII Level Editor</title>
  </head>
  <body>
    <canvas id="map"></canvas>
    <!-- Lewa kolumna startuje pusta - sekcje trafiaja tu dopiero po przeciagnieciu przez usera. -->
    <aside id="sidebar-left" class="sidebar"></aside>
    <aside id="sidebar" class="sidebar">
      <!-- Karta Map istnieje zawsze, ale widac ja tylko w trybie Simplified (CSS po data-section).
           Stoi pierwsza, zeby w tym trybie byla na gorze kolumny - tak jak mapa w wersji v1. -->
      <details open data-section="map">
        <summary>Map</summary>
        <div class="section-body" id="panel-map"></div>
      </details>
      <!-- Extra features: Simplified + zaznaczony checkbox w karcie Map (klasa show-extra na body).
           Tytul w <span>, bo naglowek dostaje jeszcze przycisk X dokladany przez panels/extra.ts. -->
      <details open data-section="extra">
        <summary class="summary-x"><span>Extra features</span></summary>
        <div class="section-body" id="panel-extra"></div>
      </details>
      <details open data-section="project">
        <summary>Project</summary>
        <div class="section-body" id="panel-project"></div>
      </details>
      <details open data-section="draw">
        <summary>Draw</summary>
        <div class="section-body" id="panel-draw"></div>
      </details>
      <details open data-section="layers">
        <summary>Layers</summary>
        <div class="section-body" id="panel-layers"></div>
      </details>
      <details open data-section="legend">
        <summary>Legend</summary>
        <div class="section-body" id="panel-legend"></div>
      </details>
      <details open data-section="generate">
        <summary>Generate</summary>
        <div class="section-body" id="panel-generate"></div>
      </details>
    </aside>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
